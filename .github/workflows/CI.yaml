on: [push]

jobs:
  snapshot:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: List root directory
        run: ls -la

      # 1) Force Gradle to download Node
      - name: Debug Node download
        run: |
          echo ">>> Triggering nodeSetup"
          ./gradlew nodeSetup --console=plain

          echo
          echo ">>> Project-local nodejs folder (.gradle/nodejs):"
          ls -la .gradle/nodejs || echo "(none here)"

          echo
          echo ">>> Gradle user-home nodejs folder (~/.gradle/nodejs):"
          ls -la $HOME/.gradle/nodejs || echo "(none here)"

      - name: Publish
        run: ./gradlew build publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: eu-central-1
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
